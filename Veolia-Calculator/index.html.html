<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veolia Chemical Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Veolia_logo.svg" alt="Veolia Logo" class="logo">
      <h1>Veolia Chemical Cost Calculator</h1>
    </header>

    <div class="calculator">
      <label for="dosage">Dosage (ppm)</label>
      <input type="number" id="dosage" placeholder="Enter dosage">

      <label for="flow">Water Flow (m³/h)</label>
      <input type="number" id="flow" placeholder="Enter flow rate">

      <button onclick="calculate()">Calculate</button>

      <div id="result">Result: –</div>
    </div>
  </div>

  <footer>
    <p>© 2025 Veolia Water Technologies</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
